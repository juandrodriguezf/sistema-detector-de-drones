name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hmi:
    name: HMI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HMI
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: HMI/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  ml:
    name: ML trainer check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r ml/requirements.txt
      - name: Compile trainer
        run: python -m py_compile ml/train.py
      - name: Smoke test training
        run: python ml/train.py ml/datasets/sample_dataset.json --epochs 1 --output /tmp/weights.json
